# ============================================================
# docker-compose.local.yml · DESARROLLO local
# ============================================================
#   Solo infraestructura: las 4 BDs + Adminer + Mongo Express.
#   Los servicios NO corren aquí: se arrancan en el host con `dotnet run`
#   (reiniciar-api.ps1 / test-runner.mjs) leyendo appsettings.json (localhost).
#
#   .\Reset-Database.ps1        # bajar todo y volver a la semilla
#   cp .env.development .env     # opcional: fija credenciales (defaults: admin123)
#
# ¿Por qué sin Redis? CacheConfig usa MemoryCache en Development (Redis es
# obligatorio solo en Producción). ¿Por qué sin servicios? En local se depura con
# `dotnet run`; la topología de PRODUCCIÓN está en docker-compose.prod.yml.
#
# Las BDs solo publican en 127.0.0.1: nada de la red local entra sin querer.
services:
  postgres:
    image: postgres:17-alpine
    container_name: tienda-local-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-admin123}
      POSTGRES_DB: ${POSTGRES_DB:-tienda}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-tienda}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - tienda-local-network

  mongodb:
    image: mongo:7.0
    container_name: tienda-local-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      MONGO_INITDB_DATABASE: ${MONGO_DB:-tienda}
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/${MONGO_DB:-tienda} --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    restart: unless-stopped
    networks:
      - tienda-local-network

  adminer:
    image: adminer
    container_name: tienda-local-adminer
    ports:
      - "${ADMINER_PORT:-8080}:8080"
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tienda-local-network

  mongo-express:
    image: mongo-express
    container_name: tienda-local-mongo-express
    ports:
      - "${MONGO_EXPRESS_PORT:-8081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: ${MONGO_ROOT_USER:-admin}
      ME_CONFIG_MONGODB_ADMINPASSWORD: ${MONGO_ROOT_PASSWORD:-admin123}
      ME_CONFIG_MONGODB_SERVER: mongodb
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_PASSWORD:-admin}
    restart: unless-stopped
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - tienda-local-network

  cassandra:
    image: cassandra:5.0
    container_name: tienda-local-cassandra
    ports:
      - "${CASSANDRA_PORT:-9042}:9042"
    # Sin techo de heap: la JVM de Cassandra pide varios GB y un portátil de
    # clase se ahoga. Con 1G vive cómoda una instancia de un solo nodo.
    environment:
      MAX_HEAP_SIZE: 1G
      HEAP_NEWSIZE: 256M
    volumes:
      - cassandra-data:/var/lib/cassandra
    # Cassandra tarda ~30-60 s en aceptar conexiones (es una JVM): el healthcheck
    # comprueba el protocolo CQL real, no el proceso.
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'SELECT now() FROM system.local' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 45s
    restart: unless-stopped
    networks:
      - tienda-local-network

networks:
  tienda-local-network:
    driver: bridge

volumes:
  postgres-data:
    driver: local
  mongodb-data:
    driver: local
  cassandra-data:
    driver: local
